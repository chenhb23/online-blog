<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>项目数据中心</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; background: #0f1419; color: #e7e9eb; min-height: 100vh; }

.header { background: linear-gradient(135deg, #1a2332 0%, #0d1117 100%); padding: 32px 40px; border-bottom: 1px solid #21262d; }
.header h1 { font-size: 24px; font-weight: 600; color: #58a6ff; margin-bottom: 6px; }
.header p { font-size: 13px; color: #8b949e; }

/* Stats Cards */
.stats-row { display: flex; gap: 20px; padding: 24px 40px; flex-wrap: wrap; }
.stat-card { flex: 1; min-width: 180px; background: #161b22; border: 1px solid #21262d; border-radius: 12px; padding: 20px 24px; position: relative; overflow: hidden; }
.stat-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; }
.stat-card.c1::before { background: #58a6ff; }
.stat-card.c2::before { background: #3fb950; }
.stat-card.c3::before { background: #f0883e; }
.stat-card.c4::before { background: #bc8cff; }
.stat-card .label { font-size: 12px; color: #8b949e; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
.stat-card .value { font-size: 36px; font-weight: 700; color: #e7e9eb; line-height: 1; }
.stat-card .sub { font-size: 12px; color: #8b949e; margin-top: 6px; }

/* Tabs */
.tabs { display: flex; gap: 0; padding: 0 40px; background: #161b22; border-bottom: 1px solid #21262d; }
.tab { padding: 14px 24px; font-size: 14px; color: #8b949e; cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.2s; }
.tab:hover { color: #e7e9eb; }
.tab.active { color: #58a6ff; border-bottom-color: #58a6ff; }

/* Sections */
.section { display: none; padding: 24px 40px; }
.section.active { display: block; }

/* Charts */
.charts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px; }
.chart-box { background: #161b22; border: 1px solid #21262d; border-radius: 12px; padding: 20px; }
.chart-box h3 { font-size: 14px; color: #8b949e; margin-bottom: 16px; text-transform: uppercase; letter-spacing: 0.5px; }

/* District Bar Chart */
.bar-chart { display: flex; flex-direction: column; gap: 10px; }
.bar-item { display: flex; align-items: center; gap: 12px; }
.bar-label { width: 70px; font-size: 13px; color: #8b949e; text-align: right; flex-shrink: 0; }
.bar-track { flex: 1; height: 24px; background: #21262d; border-radius: 4px; overflow: hidden; position: relative; }
.bar-fill { height: 100%; border-radius: 4px; transition: width 0.6s ease; display: flex; align-items: center; padding-left: 8px; }
.bar-fill span { font-size: 11px; color: #fff; font-weight: 600; white-space: nowrap; }
.bar-count { width: 50px; font-size: 13px; color: #8b949e; }

/* Pie Chart */
.pie-container { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
.pie-svg { width: 140px; height: 140px; }
.pie-legend { display: flex; flex-direction: column; gap: 6px; }
.legend-item { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #8b949e; }
.legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

/* Zuchang Title Stats */
.zc-title-list { display: flex; flex-direction: column; gap: 8px; }
.zc-title-item { display: flex; align-items: center; gap: 12px; padding: 10px 14px; background: #21262d; border-radius: 8px; }
.zc-title-item .tag { font-size: 12px; padding: 3px 10px; border-radius: 12px; font-weight: 600; }
.zc-title-item .name { flex: 1; font-size: 13px; color: #e7e9eb; }
.zc-title-item .count { font-size: 13px; color: #8b949e; }

/* Table */
.table-wrap { background: #161b22; border: 1px solid #21262d; border-radius: 12px; overflow: hidden; }
.proj-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.proj-table th { text-align: left; padding: 12px 16px; background: #21262d; color: #8b949e; font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid #30363d; }
.proj-table td { padding: 12px 16px; border-bottom: 1px solid #21262d; color: #e7e9eb; vertical-align: top; }
.proj-table tr:last-child td { border-bottom: none; }
.proj-table tr:hover td { background: #1c2128; }
.zc-badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; background: #1f2937; border-radius: 20px; font-size: 11px; margin: 2px 4px 2px 0; white-space: nowrap; }
.zc-avatar { width: 20px; height: 20px; border-radius: 50%; object-fit: cover; background: #30363d; }
.district-tag { display: inline-block; padding: 2px 8px; background: #1f2937; border-radius: 4px; font-size: 11px; color: #8b949e; }
.rent-range { color: #f0883e; font-weight: 500; }

/* Search */
.search-box { margin-bottom: 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.search-box input { padding: 8px 14px; background: #0d1117; border: 1px solid #30363d; border-radius: 8px; color: #e7e9eb; font-size: 13px; width: 260px; outline: none; }
.search-box input:focus { border-color: #58a6ff; }
.search-box input::placeholder { color: #484f58; }
.filter-select { padding: 8px 12px; background: #0d1117; border: 1px solid #30363d; border-radius: 8px; color: #e7e9eb; font-size: 13px; outline: none; cursor: pointer; }
.filter-select option { background: #161b22; }

.pagination { display: flex; gap: 6px; align-items: center; margin-top: 16px; justify-content: center; flex-wrap: wrap; }
.page-btn { padding: 6px 12px; background: #21262d; border: 1px solid #30363d; border-radius: 6px; color: #8b949e; font-size: 12px; cursor: pointer; transition: all 0.2s; }
.page-btn:hover { color: #e7e9eb; border-color: #58a6ff; }
.page-btn.active { background: #58a6ff; color: #fff; border-color: #58a6ff; }
.page-info { font-size: 12px; color: #8b949e; margin: 0 8px; }

/* Zuchang People Grid */
.zc-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
.zc-person-card { background: #161b22; border: 1px solid #21262d; border-radius: 12px; padding: 16px; }
.zc-person-card .zc-top { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
.zc-person-card .zc-avatar-lg { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; background: #30363d; }
.zc-person-card .zc-name { font-size: 15px; font-weight: 600; color: #e7e9eb; }
.zc-person-card .zc-title-tag { font-size: 11px; padding: 2px 8px; background: #1f2937; border-radius: 10px; color: #58a6ff; margin-top: 4px; display: inline-block; }
.zc-person-card .zc-phone { font-size: 13px; color: #8b949e; margin-top: 6px; font-family: monospace; }
.zc-person-card .zc-projects { margin-top: 10px; font-size: 11px; color: #484f58; }
.zc-person-card .zc-proj-tag { display: inline-block; padding: 2px 8px; background: #21262d; border-radius: 4px; color: #8b949e; margin: 2px 4px 2px 0; }

/* Responsive */
@media (max-width: 768px) {
  .stats-row, .section, .header { padding-left: 20px; padding-right: 20px; }
  .charts-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div class="header">
  <h1>📊 项目数据中心</h1>
  <p>项目总数 / 驻场人统计 / 分布可视化</p>
</div>

<div class="stats-row" id="statsRow"></div>

<div class="tabs">
  <div class="tab active" onclick="showTab('overview')">总览</div>

  <div class="tab" onclick="showTab('zuchangs')">驻场人员</div>
</div>

<!-- Overview -->
<div class="section active" id="section-overview">

  </div>
</div>

<!-- Projects Table -->
<div class="section" id="section-projects">
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="搜索项目名称..." oninput="filterProjects()">

    </select>
    <select class="filter-select" id="zcFilter" onchange="filterProjects()">

    </select>
  </div>
  <div class="table-wrap">
    <table class="proj-table">

          <th>项目名称</th>
          <th>区域</th>
          <th>租金范围</th>
          <th>房间数</th>
          <th>驻场人员</th>
        </tr>
      </thead>
      <tbody id="projTableBody"></tbody>
    </table>
  </div>
  <div class="pagination" id="projPagination"></div>
</div>

<!-- Zuchang People -->
<div class="section" id="section-zuchangs">

  </div>
  <div class="zc-grid" id="zcGrid"></div>
</div>

      <div class="label">项目总数</div>
      <div class="value">${d.totalProjects}</div>
      <div class="sub">个项目</div>
    </div>
    <div class="stat-card c2">
      <div class="label">驻场人员</div>
      <div class="value">${d.totalUniqueZuchangs}</div>
      <div class="sub">位不同的驻场人</div>
    </div>
    <div class="stat-card c3">
      <div class="label">驻场分配</div>
      <div class="value">${d.totalZuchangAssignments}</div>
      <div class="sub">条项目-驻场关联</div>
    </div>
    <div class="stat-card c4">
      <div class="label">覆盖区域</div>
      <div class="value">${Object.keys(d.districtStats).length}</div>
      <div class="sub">个行政区</div>
    </div>
  `;
}

function renderOverview() {
  const districts = Object.keys(vizData.districtStats).sort((a, b) =>
    vizData.districtStats[b].projectCount - vizData.districtStats[a].projectCount
  );
  const maxProjects = Math.max(...districts.map(d => vizData.districtStats[d].projectCount));
  const maxZuchang = Math.max(...districts.map(d => vizData.districtStats[d].zuchangCount));

  // District bars
  const barHtml = districts.map((d, i) => {
    const pct = (vizData.districtStats[d].projectCount / maxProjects * 100).toFixed(1);
    return `<div class="bar-item">
      <div class="bar-label">${d}</div>
      <div class="bar-track">
        <div class="bar-fill" style="width:${pct}%;background:${COLORS[i%COLORS.length]}">
          <span>${vizData.districtStats[d].projectCount}个</span>
        </div>
      </div>
    </div>`;
  }).join('');
  document.getElementById('districtBar').innerHTML = barHtml;

  // Zuchang bars
  const zcBarHtml = districts.map((d, i) => {
    const pct = (vizData.districtStats[d].zuchangCount / maxZuchang * 100).toFixed(1);
    return `<div class="bar-item">
      <div class="bar-label">${d}</div>
      <div class="bar-track">
        <div class="bar-fill" style="width:${pct}%;background:${COLORS[i%COLORS.length]}">
          <span>${vizData.districtStats[d].zuchangCount}人</span>
        </div>
      </div>
    </div>`;
  }).join('');
  document.getElementById('districtZcBar').innerHTML = zcBarHtml;

  // Pie chart
  const total = districts.reduce((s, d) => s + vizData.districtStats[d].projectCount, 0);
  let cumulative = 0;
  const slices = districts.map((d, i) => {
    const val = vizData.districtStats[d].projectCount;
    const pct = val / total;
    const startAngle = cumulative * 360;
    cumulative += pct;
    const endAngle = cumulative * 360;
    const r = 60, cx = 70, cy = 70;
    const toRad = a => a * Math.PI / 180;
    const x1 = cx + r * Math.cos(toRad(startAngle - 90));
    const y1 = cy + r * Math.sin(toRad(startAngle - 90));
    const x2 = cx + r * Math.cos(toRad(endAngle - 90));
    const y2 = cy + r * Math.sin(toRad(endAngle - 90));
    const large = (endAngle - startAngle) > 180 ? 1 : 0;
    const path = `M${cx},${cy} L${x1},${y1} A${r},${r} 0 ${large},1 ${x2},${y2} Z`;
    return `<path d="${path}" fill="${COLORS[i%COLORS.length]}" />`;
  }).join('');
  const legendHtml = districts.map((d, i) =>
    `<div class="legend-item"><div class="legend-dot" style="background:${COLORS[i%COLORS.length]}"></div>${d} (${vizData.districtStats[d].projectCount})</div>`
  ).join('');
  document.getElementById('districtPie').innerHTML =
    `<svg class="pie-svg" viewBox="0 0 140 140">${slices}</svg><div class="pie-legend">${legendHtml}</div>`;

  // Title stats
  const titles = Object.entries(vizData.titleStats).sort((a, b) => b[1].count - a[1].count);
  const titleHtml = titles.slice(0, 10).map(([title, data], i) =>
    `<div class="zc-title-item">
      <span class="tag" style="background:${COLORS[i%COLORS.length]}20;color:${COLORS[i%COLORS.length]}">${data.count}</span>
      <span class="name">${title || '未知'}</span>
      <span class="count">${data.count}人</span>
    </div>`
  ).join('');
  document.getElementById('titleStats').innerHTML = titleHtml;
}

function buildFilters() {
  const districts = Object.keys(vizData.districtStats).sort();
  const districtSelect = document.getElementById('districtFilter');
  districts.forEach(d => {
    const opt = document.createElement('option');
    opt.value = d; opt.textContent = d;
    districtSelect.appendChild(opt);
  });

  const zcSelect = document.getElementById('zcFilter');
  Object.values(vizData.uniqueZuchangs).forEach(zc => {
    const opt = document.createElement('option');
    opt.value = zc.phone; opt.textContent = `${zc.title} - ${zc.name}`;
    zcSelect.appendChild(opt);
  });
}

function filterProjects() {
  const search = document.getElementById('searchInput').value.trim().toLowerCase();
  const district = document.getElementById('districtFilter').value;
  const zc = document.getElementById('zcFilter').value;

  filteredProjects = vizData.projects.filter(p => {
    if (search && !p.name.toLowerCase().includes(search)) return false;
    if (district && p.district !== district) return false;
    if (zc) {
      const has = p.zhuchangList.some(z => z.user_phone === zc);
      if (!has) return false;
    }
    return true;
  });
  projPage = 1;
  renderProjectTable();
}

function filterZuchangs() {
  const search = document.getElementById('zcSearchInput').value.trim().toLowerCase();
  filteredZuchangs = Object.values(vizData.uniqueZuchangs).filter(z => {
    if (search && !z.name.toLowerCase().includes(search) && !z.title.toLowerCase().includes(search) && !z.nickname.toLowerCase().includes(search)) return false;
    return true;
  });
  renderZuchangGrid();
}

function renderProjectTable() {
  const start = (projPage - 1) * PROJ_PER_PAGE;
  const page = filteredProjects.slice(start, start + PROJ_PER_PAGE);
  const tbody = document.getElementById('projTableBody');
  tbody.innerHTML = page.map(p => {
    const zcHtml = p.zhuchangList.map(z => {
      const txt = `${z.user_ZC_title || ''} / ${z.user_real_name || ''} / ${z.user_phone || ''}`;
      return `<span class="zc-badge" title="${txt}">
        <img class="zc-avatar" src="${z.user_head_img || ''}" onerror="this.style.display='none'">
        ${z.user_real_name || ''} (${z.user_ZC_title || ''})
      </span>`;
    }).join('');
    const rentRange = p.rentMax && p.rentMax !== p.rentMin
      ? `${p.rentMin} - ${p.rentMax}${p.rentType}`
      : p.rentMin ? `${p.rentMin}${p.rentType}` : '未知';
    return `<tr>
      <td>${p.id}</td>
      <td>${p.name}</td>
      <td><span class="district-tag">${p.district || '未知'}</span></td>
      <td class="rent-range">${rentRange}</td>
      <td>${p.roomCount || 0}套</td>
      <td>${zcHtml || '<span style="color:#484f58">无</span>'}</td>
    </tr>`;
  }).join('');

  renderProjPagination();
}

function renderProjPagination() {
  const totalPages = Math.ceil(filteredProjects.length / PROJ_PER_PAGE);
  const pag = document.getElementById('projPagination');
  if (totalPages <= 1) { pag.innerHTML = ''; return; }
  let html = `<span class="page-info">${projPage} / ${totalPages} 页，共 ${filteredProjects.length} 个项目</span>`;
  html += `<button class="page-btn" onclick="changeProjPage(-1)" ${projPage===1?'disabled':''}>上一页</button>`;
  const maxBtns = 5;
  let startPage = Math.max(1, projPage - 2);
  let endPage = Math.min(totalPages, startPage + maxBtns - 1);
  if (endPage - startPage < maxBtns - 1) startPage = Math.max(1, endPage - maxBtns + 1);
  for (let i = startPage; i <= endPage; i++) {
    html += `<button class="page-btn ${i===projPage?'active':''}" onclick="goProjPage(${i})">${i}</button>`;
  }
  html += `<button class="page-btn" onclick="changeProjPage(1)" ${projPage===totalPages?'disabled':''}>下一页</button>`;
  pag.innerHTML = html;
}

function changeProjPage(dir) { goProjPage(projPage + dir); }
function goProjPage(p) { projPage = p; renderProjectTable(); window.scrollTo({top:0,behavior:'smooth'}); }

function renderZuchangGrid() {
  const grid = document.getElementById('zcGrid');
  grid.innerHTML = filteredZuchangs.map(zc => {
    // Find projects this zuchang is assigned to
    const assignedProjects = vizData.projects.filter(p =>
      p.zhuchangList.some(z => z.user_phone === zc.phone)
    ).map(p => `<span class="zc-proj-tag">${p.name}</span>`).join('');

    return `<div class="zc-person-card">
      <div class="zc-top">
        <img class="zc-avatar-lg" src="${zc.headImg || ''}" onerror="this.style.display='none'">
        <div>
          <div class="zc-name">${zc.name || ''}</div>
          <span class="zc-title-tag">${zc.title || ''}</span>
        </div>
      </div>
      <div class="zc-phone">📞 ${zc.phone || ''}</div>
      ${assignedProjects ? `<div class="zc-projects">负责项目: ${assignedProjects}</div>` : ''}
    </div>`;
  }).join('');
}

function showTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelector(`.tab[onclick="showTab('${name}')"]`).classList.add('active');
  document.getElementById('section-' + name).classList.add('active');
}

loadData();
</script>
</body>
</html>
